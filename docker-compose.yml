services:
  developerfolio:
    image: hub.andronymous.ir/devfolio:1.0.1
    build: .
    container_name: developerfolio
    cap_add:
      - NET_ADMIN # Needed by fail2ban inside SWAG
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Asia/Tehran}
      - URL=andronymous.ir
      # Also get a certificate for www.andronymous.ir. Only enable this once
      # www has a DNS record pointing at this server, or validation fails.
      - SUBDOMAINS=${SUBDOMAINS:-}
      - ONLY_SUBDOMAINS=false
      - VALIDATION=http
      # Optional: Let's Encrypt sends certificate expiry warnings here
      - EMAIL=${LETSENCRYPT_EMAIL:-}
      # Set to true while testing to avoid Let's Encrypt rate limits
      - STAGING=${STAGING:-false}
    volumes:
      - swag-config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  swag-config:
